
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻里布分団 水利マップ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body {
  margin: 0;
  font-family: sans-serif;
}
header {
  background: #b91c1c;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}
#menu {
  padding: 10px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
button {
  padding: 10px 14px;
  border: 1px solid #ccc;
  border-radius: 7px;
  background: white;
  font-size: 14px;
}
#map {
  height: 65vh;
  min-height: 350px;
}
#legend {
  background: #f8fafc;
  border: 1px solid #cccccc;
  border-radius: 8px;
  padding: 10px;
  margin: 8px;
  font-size: 13px;
  line-height: 1.8;
}
@media (max-width: 600px) {
  #legend {
    font-size: 12px;
    padding: 8px;
    margin: 5px;
  }
}</style>
</head>

<body>

<header>麻里布分団 水利マップ</header>

<div id="menu">
  <button onclick="showLocation()">現在地</button>
  <button onclick="map.setView([34.17,132.22],16)">岩国周辺</button>
  <button id="loginButton" type="button">Googleでログイン</button>
  <button id="emailLoginButton" type="button">メールでログイン</button>
　<button id="registerButton" type="button">新規登録</button>
  <button id="approveMemberButton" type="button" style="display:none;">
  団員承認
</button>
  <button id="logoutButton" type="button"
onclick="alert('ログアウトボタン確認OK')">
ログアウト
</button>
  <button id="addHydrantButton" type="button">消火栓を追加</button>
　<button id="saveHydrantButton" type="button">消火栓を保存</button>
</div>
<div id="legend">
  <strong>消防水利の種類</strong><br>
  🔴 消火栓　
  🔵 防火水槽　
  🟢 その他
  <hr>
  <strong>使用状態</strong><br>
  ⚪ 未確認　
  🟡 使用注意　
  ⚫ 使用不可<br>
  使用可能：通常の枠線
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([34.17,132.22],15);
let addHydrantMode = false;

document.getElementById("addHydrantButton").addEventListener("click", function() {
  addHydrantMode = true;
  alert("地図上の消火栓の場所をクリックしてください");
});

map.on("click", function(e) {
  if (!addHydrantMode) return;

  const lat = e.latlng.lat;
  const lng = e.latlng.lng;
　window.newHydrantLocation = { lat, lng };
  L.marker([lat, lng])
  .addTo(map)
    .bindPopup("新しい消火栓")
    .openPopup();

  addHydrantMode = false;
});
L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }
).addTo(map);

function showLocation() {
  if (!navigator.geolocation) {
    alert('現在地を取得できません');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      map.setView([lat,lng],18);

     L.marker([lat,lng])
  .addTo(map)
        .bindPopup('現在地')
        .openPopup();
    },
    function() {
      alert('現在地を取得できませんでした。位置情報を許可してください。');
    }
  );
}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, collection, getDocs, getDoc, addDoc, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCJNMjasMqGRKZbELDZlhgsuqMbuSTjeV4",
  authDomain: "marifu-water-map.firebaseapp.com",
  projectId: "marifu-water-map",
  storageBucket: "marifu-water-map.firebasestorage.app",
  messagingSenderId: "776871900033",
  appId: "1:776871900033:web:f1d3055ea01f2fc308ae80",
  measurementId: "G-BMMVXV0F93"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const db = getFirestore(app);
document.getElementById("approveMemberButton").addEventListener("click", async () => {
  if (!auth.currentUser) return;

  try {
    const adminSnap = await getDoc(
      doc(db, "members", auth.currentUser.uid)
    );

    if (!adminSnap.exists() ||
        adminSnap.data().role !== "admin" ||
        adminSnap.data().approved !== true) {
      alert("管理者だけが利用できます");
      return;
    }

    const snapshot = await getDocs(collection(db, "members"));
    const pending = [];

   snapshot.forEach((member) => {
  if (member.data().approved !== true) {
    pending.push({
      id: member.id,
      name: member.data().name || "名前未登録"
    });
  }
});
    if (pending.length === 0) {
  alert("承認待ちの団員はいません");
} else {
  const names = pending.map((m, i) =>
    (i + 1) + "：" + m.name
  ).join("\n");

  const choice = prompt(
    "承認する団員の番号を入力してください。\n" +
    names
  );

  if (choice === null) return;

  const number = Number(choice);

  if (!Number.isInteger(number) ||
      number < 1 ||
      number > pending.length) {
    alert("正しい番号を入力してください");
    return;
  }

  const member = pending[number - 1];

  if (!confirm(member.name + " さんを承認しますか？")) {
    return;
  }

  await updateDoc(doc(db, "members", member.id), {
    approved: true
  });

  alert(member.name + " さんを承認しました！");
}
  } catch (error) {
    alert("団員情報を取得できませんでした：" + error.message);
  }
});
  document.getElementById("logoutButton").addEventListener("click", async () => {
  try {
    await signOut(auth);
    alert("ログアウトしました");
    window.location.reload();
  } catch (error) {
    alert("ログアウトできませんでした：" + error.message);
  }
});
  document.getElementById("saveHydrantButton").addEventListener("click", async () => {
  const location = window.newHydrantLocation;

  if (!auth.currentUser) {
    alert("先にGoogleでログインしてください");
    return;
  }

  if (!location) {
    alert("先に「消火栓を追加」で場所を指定してください");
    return;
  }
const type = prompt(
  "消防水利の種類を番号で選んでください\n" +
  "1：消火栓\n" +
  "2：防火水槽\n" +
  "3：その他"
);

if (type === null) return;

if (!["1", "2", "3"].includes(type)) {
  alert("1・2・3のいずれかを入力してください");
  return;
}
  const status = prompt(
  "消防水利の使用状態を選んでください\n" +
  "1：使用可能\n" +
  "2：使用注意\n" +
  "3：使用不可"
);

if (status === null) return;

if (!["1", "2", "3"].includes(status)) {
  alert("1・2・3のいずれかを入力してください");
  return;
}
    
    const name = prompt("消防水利の名前を入力してください");

  if (!name || !name.trim()) {
    alert("保存を中止しました");
    return;
  }

  try {
    await addDoc(collection(db, "water_sources"), {
      name: name.trim(),
      type: type,
     　status: status,
      lat: location.lat,
      lng: location.lng
    });

        window.newHydrantLocation = null;
    alert("消火栓を保存しました！");
    window.location.reload();
  } catch (error) {
    console.error(error);
    alert("保存できませんでした：" + error.message);
  }
});  
document.getElementById("loginButton").addEventListener("click", async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    alert("ログインできませんでした: " + error.message);
  }
});

document.getElementById("emailLoginButton").addEventListener("click", async () => {
  const email = prompt("メールアドレスを入力してください");
  if (!email) return;

  const password = prompt("パスワードを入力してください");
  if (!password) return;

  try {
    await signInWithEmailAndPassword(auth, email.trim(), password);
    alert("メールでログインできました！");
  } catch (error) {
    console.error(error);
    alert("ログインできませんでした。メールアドレスとパスワードを確認してください。");
  }
});
document.getElementById("registerButton").addEventListener("click", async () => {
  const email = prompt("登録するメールアドレスを入力してください");
  if (!email) return;

  const password = prompt("登録するパスワードを入力してください（6文字以上）");
  if (!password) return;
const name = prompt("団員のお名前を入力してください");

if (!name || !name.trim()) {
  alert("登録を中止しました");
  return;
}
  try {
    const result = await createUserWithEmailAndPassword(
      auth, email.trim(), password
    );
await setDoc(doc(db, "members", result.user.uid), {
  name: name.trim(),
  approved: false
});
    
    alert(
      "新規登録が完了しました。\n" +
      "分団長の承認後に水利マップを利用できます。\n" +
      "登録UID：" + result.user.uid
    );
  } catch (error) {
    console.error(error);
    alert("新規登録できませんでした：" + error.message);
  }
});
  onAuthStateChanged(auth, async (user) => {
  if (user) {
    document.getElementById("loginButton").textContent = "確認中...";

    try {
      const memberSnap = await getDoc(doc(db, "members", user.uid));

      if (memberSnap.exists() && memberSnap.data().approved === true) {
      if (memberSnap.data().role === "admin") {
  document.getElementById("approveMemberButton").style.display = "inline-block";
}
        document.getElementById("loginButton").textContent = "ログイン済み";
        loadWaterSources();
      } else {
        document.getElementById("loginButton").textContent = "承認待ち";
        alert("分団長の承認待ちです。承認後に水利マップを利用できます。");
      }
    } catch (error) {
      console.error(error);
      document.getElementById("loginButton").textContent = "確認エラー";
      alert("団員登録の確認ができませんでした。");
    }
  } else {
    document.getElementById("loginButton").textContent = "Googleでログイン";
  }
});
 window.editHydrant = async function(id, oldName) {
  const newName = prompt("新しい消火栓の名前を入力してください", oldName);

  if (newName === null || newName.trim() === "") return;

  try {
    await updateDoc(doc(db, "water_sources", id), {
      name: newName.trim()
    });
    alert("消火栓の名前を保存しました");
    location.reload();
  } catch (error) {
    alert("保存できませんでした：" + error.message);
  }
};
 window.moveHydrant = async function(id) {
  alert("位置訂正モードです。地図上の新しい位置をクリックしてください。");

  map.once("click", function(e) {
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;

    alert("新しい位置を選択しました。\n緯度：" + lat + "\n経度：" + lng);
  });
};
 
window.moveHydrant = async function(id) {
  if (!auth.currentUser) {
    alert("先にGoogleでログインしてください");
    return;
  }

  alert("地図上の新しい位置をクリックしてください");

  map.once("click", async function(e) {
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;

    if (!confirm("この位置に変更して保存しますか？")) {
      return;
    }

    try {
      await updateDoc(doc(db, "water_sources", id), {
        lat: lat,
        lng: lng
      });

      alert("新しい位置を保存しました！");
      window.location.reload();

    } catch (error) {
      alert("保存できませんでした：" + error.message);
    }
  });
};

  window.editStatus = async function(id) {
  if (!auth.currentUser) {
    alert("先にログインしてください");
    return;
  }

  const status = prompt(
    "新しい使用状態を選んでください\n" +
    "1：使用可能\n" +
    "2：使用注意\n" +
    "3：使用不可"
  );

  if (status === null) return;

  if (!["1", "2", "3"].includes(status)) {
    alert("1・2・3のいずれかを入力してください");
    return;
  }

  try {
    await updateDoc(doc(db, "water_sources", id), {
      status: status
    });

    alert("使用状態を保存しました！");
    window.location.reload();

  } catch (error) {
    alert("保存できませんでした：" + error.message);
  }
};
  async function loadWaterSources() {
  try {
    const snapshot = await getDocs(collection(db, "water_sources"));

    snapshot.forEach((doc) => {
      const data = doc.data();
      const type = data.type || "1";
　　　　const status = data.status || "0";
     const markerWeight = status === "3" ? 6 : status === "2" ? 4 : 2;
      console.log("水利データ確認:", doc.id, data);
　console.log("項目名の文字コード:", data.name, Object.keys(data).map(k => [k, [...k].map(c => c.charCodeAt(0))]));
      const lat = Number(data.lat);
　　　const lng = Number(data.lng);

if (!Number.isFinite(lat) || !Number.isFinite(lng) ||
    Math.abs(lat) > 90 || Math.abs(lng) > 180) {
  return;
}
     

      L.circleMarker([lat, lng], {
  radius: 9,
　color: status === "0" ? "white" : status === "3" ? "black" : status === "2" ? "yellow" : type === "2" ? "blue" : type === "3" ? "green" : "red",
  fillColor: type === "2" ? "blue" : type === "3" ? "green" : "red",
  fillOpacity: 0.9,
  weight: markerWeight
})
  .addTo(map)
       .bindPopup(
  (data.name || "消防水利") +
  "<br>使用状態：" +
  (status === "0" ? "未確認" :
 status === "2" ? "使用注意" :
 status === "3" ? "使用不可" : "使用可能") +
  '<br><button type="button" onclick="editHydrant(\'' + doc.id + '\', \'' + (data.name || "").replace(/'/g, "\\'") + '\')">訂正</button>' +
'<br><button type="button" onclick="moveHydrant(\'' + doc.id + '\')">位置訂正</button>'+
'<br><button type="button" onclick="editStatus(\'' + doc.id + '\')">使用状態訂正</button>'
);
 　　　console.log("消火栓を地図に追加:", data.name);
    });
　const markers = [];
　console.log("マーカー確認開始");
    console.log("地図上のマーカー確認開始");
    map.eachLayer((layer) => {
 if (layer instanceof L.Marker || layer instanceof L.CircleMarker) {
    markers.push(layer);
  }
      console.log("マーカーの位置と名前:",
  layer instanceof L.Marker ? layer.getLatLng() : "位置なし",
  layer instanceof L.Marker ? (layer.getPopup()?.getContent() || "名前なし") : "マーカー以外"
);
});
　
    if (markers.length > 0) {
  const group = L.featureGroup(markers);
  map.fitBounds(group.getBounds().pad(0.2), { maxZoom: 17 });
}
  } catch (error) {
    console.error(error);
    alert("水利情報を読み込めませんでした。団員登録を確認してください。");
  }
}
</script>

</body>
</html>
