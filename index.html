
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>麻里布分団 水利マップ</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body {
  margin: 0;
  font-family: sans-serif;
}
header {
  background: #b91c1c;
  color: white;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}
#menu {
  padding: 10px;
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
button {
  padding: 10px 14px;
  border: 1px solid #ccc;
  border-radius: 7px;
  background: white;
  font-size: 14px;
}
#map {
  height: calc(100vh - 145px);
  min-height: 400px;
}
</style>
</head>

<body>

<header>麻里布分団 水利マップ</header>

<div id="menu">
  <button onclick="showLocation()">現在地</button>
  <button onclick="map.setView([34.17,132.22],16)">岩国周辺</button>
  <button id="loginButton" type="button">Googleでログイン</button>
　<button id="addHydrantButton" type="button">消火栓を追加</button>
　<button id="saveHydrantButton" type="button">消火栓を保存</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([34.17,132.22],15);
let addHydrantMode = false;

document.getElementById("addHydrantButton").addEventListener("click", function() {
  addHydrantMode = true;
  alert("地図上の消火栓の場所をクリックしてください");
});

map.on("click", function(e) {
  if (!addHydrantMode) return;

  const lat = e.latlng.lat;
  const lng = e.latlng.lng;
　window.newHydrantLocation = { lat, lng };
  L.marker([lat, lng])
    .addTo(map)
    .bindPopup("新しい消火栓")
    .openPopup();

  addHydrantMode = false;
});
L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }
).addTo(map);

function showLocation() {
  if (!navigator.geolocation) {
    alert('現在地を取得できません');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      map.setView([lat,lng],18);

      L.marker([lat,lng])
        .addTo(map)
        .bindPopup('現在地')
        .openPopup();
    },
    function() {
      alert('現在地を取得できませんでした。位置情報を許可してください。');
    }
  );
}
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";
import { getFirestore, collection, getDocs , addDoc} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore.js";
  
const firebaseConfig = {
  apiKey: "AIzaSyCJNMjasMqGRKZbELDZlhgsuqMbuSTjeV4",
  authDomain: "marifu-water-map.firebaseapp.com",
  projectId: "marifu-water-map",
  storageBucket: "marifu-water-map.firebasestorage.app",
  messagingSenderId: "776871900033",
  appId: "1:776871900033:web:f1d3055ea01f2fc308ae80",
  measurementId: "G-BMMVXV0F93"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const db = getFirestore(app);
document.getElementById("saveHydrantButton").addEventListener("click", async () => {
  const location = window.newHydrantLocation;

  if (!auth.currentUser) {
    alert("先にGoogleでログインしてください");
    return;
  }

  if (!location) {
    alert("先に「消火栓を追加」で場所を指定してください");
    return;
  }

  const name = prompt("消火栓の名前を入力してください");

  if (!name || !name.trim()) {
    alert("保存を中止しました");
    return;
  }

  try {
    await addDoc(collection(db, "water_sources"), {
      name: name.trim(),
      lat: location.lat,
      lng: location.lng
    });

    window.newHydrantLocation = null;
    alert("消火栓を保存しました！");
    window.location.reload();
  } catch (error) {
    console.error(error);
    alert("保存できませんでした：" + error.message);
  }
});  
document.getElementById("loginButton").addEventListener("click", async () => {
  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    alert("ログインできませんでした: " + error.message);
  }
});

onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("loginButton").textContent = "ログイン済み";
    alert("ログイン確認OK");
    loadWaterSources();
  } else {
    document.getElementById("loginButton").textContent = "Googleでログイン";
  }
});
async function loadWaterSources() {
  try {
    const snapshot = await getDocs(collection(db, "water_sources"));
alert("取得した水利の件数：" + snapshot.size);
    snapshot.forEach((doc) => {
      const data = doc.data();
　　　　console.log("水利データ確認:", doc.id, data);
　console.log("項目名の文字コード:", data.name, Object.keys(data).map(k => [k, [...k].map(c => c.charCodeAt(0))]));
      const lat = Number(data.lat);
　　　const lng = Number(data.lng);

if (!Number.isFinite(lat) || !Number.isFinite(lng) ||
    Math.abs(lat) > 90 || Math.abs(lng) > 180) {
  return;
}
     

      L.marker([lat, lng])
        .addTo(map)
        .bindPopup(
  (data.name || "消防水利") +
  '<br><button type="button">訂正</button>'
);
 　　　console.log("消火栓を地図に追加:", data.name);
    });
　const markers = [];
　console.log("マーカー確認開始");
    console.log("地図上のマーカー確認開始");
    map.eachLayer((layer) => {
  if (layer instanceof L.Marker) {
    markers.push(layer);
  }
      console.log("マーカーの位置と名前:",
  layer instanceof L.Marker ? layer.getLatLng() : "位置なし",
  layer instanceof L.Marker ? (layer.getPopup()?.getContent() || "名前なし") : "マーカー以外"
);
});
　alert("地図上のマーカー数：" + markers.length);
    if (markers.length > 0) {
  const group = L.featureGroup(markers);
  map.fitBounds(group.getBounds().pad(0.2), { maxZoom: 17 });
}
  } catch (error) {
    console.error(error);
    alert("水利情報を読み込めませんでした。団員登録を確認してください。");
  }
}
</script>
<script>
alert("ログイン確認OK");
</script>
</body>
</html>
